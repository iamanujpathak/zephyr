description: |
  Infineon M0S8 CTBm (Continuous Time Block mini), found in PSOC 4 devices.

  The block holds two opamps, described by infineon,ctbm-opamp child nodes.

compatible: "infineon,ctbm"

include: base.yaml

properties:
  reg:
    required: true

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0
