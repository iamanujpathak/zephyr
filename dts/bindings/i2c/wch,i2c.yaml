description: WCH I2C controller

compatible: "wch,i2c"

include: [i2c-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  clocks:
    description: |
      Clock gate to enable before the peripheral is used. Required on the
      ch32v family; the CH5xx block is fed from a fixed clock and omits it.

  interrupts:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true
